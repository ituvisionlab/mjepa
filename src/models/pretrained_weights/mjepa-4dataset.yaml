app: vjepa
nodes: 1
tasks_per_node: 4
data:
  dataset_type: MRIDataset
  datasets:
  - src/datasets/adni_train_split.csv
  - src/datasets/oasis_train_split.csv
  - src/datasets/ixi_file_paths.csv
  - src/datasets/mood_file_paths.csv
  decode_one_clip: true
  batch_size: 8
  num_clips: 8
  num_frames: 16
  tubelet_size: 8
  sampling_rate: 1
  crop_size: 224
  patch_size: 8
  in_channel_size: 1
  random_clip_sampling: true
  pin_mem: true
  num_workers: 8
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: true
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.9
  - 1.1
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10
  reprob: 0.0
logging:
  folder: /gpfs/data/sodicksonlab/gozde/logs/
  write_tag: jepa
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
  max_temporal_keep: 1.0
  max_keep: null
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
  max_temporal_keep: 1.0
  max_keep: null
meta:
  load_checkpoint: false
  read_checkpoint: null
  ckpt_folder: /gpfs/data/sodicksonlab/gozde/pretrained_weights/
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_base
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: 200
  ipe_scale: 1.25
  clip_grad: 1.0
  weight_decay: 0.04
  final_weight_decay: 0.1
  epochs: 2000
  warmup: 20
  start_lr: 0.0001
  lr: 0.0001
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0

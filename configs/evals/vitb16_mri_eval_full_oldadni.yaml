nodes: 1
tasks_per_node: 2
tag: mri-probe #k400-16x8x3
eval_name: video_classification_frozen
resume_checkpoint: false #true 
checkpoint_path: null #/gpfs/data/sodicksonlab/gozde/logs/mjepa_eval_distributed_2024_12_03__11_16_35/model_ckpt/latest-model/jepa-latest.pth.tar # null #classification model
logging:
  folder: /gpfs/data/sodicksonlab/gozde/logs/
data:
  root_path: /gpfs/home/unalg01/jepa
  dataset_train: 
  - src/datasets/adni_train_split.csv 
  dataset_val: 
  - src/datasets/adni_val_split.csv 
  dataset_type: MRIDataset
  num_classes: 2
  frames_per_clip: 16
  num_segments: 8 #16 #rename to num_clips
  num_views_per_segment: 3
  frame_step: 1
  num_workers: 8
  random_clip_sampling: false
data_aug:
  auto_augment: false #true
  random_noise: 0.01
  random_bias: 0.1
  intensity_gamma: 0.1
  random_resize_aspect_ratio:
  - 0.9 
  - 1.1 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10  
optimization:
  attend_across_segments: true
  num_epochs: 500
  resolution: 128 #192
  batch_size: 16 #8
  weight_decay: 0.001
  final_weight_decay: 1.0e-4 #0.1 #for large datasets
  start_lr: 5.0e-4 #3.0e-5 #5e-05
  lr: 5.0e-3 #2.0e-4 #1.0e-4
  final_lr: 5.0e-5 #5.0e-6 #1.0e-6
  warmup: 20
  use_bfloat16: true
  clip_grad_classifier: 10.0
  seed: 234
  train_log_iter_freq: 1
  val_log_iter_freq: 1
pretrain:
  model_name: vit_base
  checkpoint_key: encoder #target_encoder
  clip_duration: null
  frames_per_clip: 16
  tubelet_size: 8
  uniform_power: true
  use_silu: false
  tight_silu: false
  use_sdpa: true
  patch_size: 8
  frozen: false #default: true
  clip_grad_encoder: 10.0
  encoder_warmup: 0
  use_pos_embed: false #default: false
  in_channel_size: 1
  frame_step: 1 # added
  folder: /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2025_01_24__09_26_23/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2025_01_13__14_44_51/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2025_01_14__21_08_18/model_ckpt/latest-model/ #corrupt model weights
  #/your_absolute_file_path_to_directory_where_pretrained_models_are_contained/
  checkpoint: null #jepa-latest.pth.tar  # name of pretrained encoder model file inside folder
  write_tag: jepa

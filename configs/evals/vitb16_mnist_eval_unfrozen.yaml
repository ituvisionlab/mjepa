nodes: 1
tasks_per_node: 2
tag: mnist-probe #k400-16x8x3
eval_name: video_classification_frozen
resume_checkpoint: false #true 
checkpoint_path: null #/gpfs/data/sodicksonlab/gozde/logs/mjepa_eval_distributed_2024_12_03__11_16_35/model_ckpt/latest-model/jepa-latest.pth.tar # null #classification model
logging:
  folder: /gpfs/data/sodicksonlab/gozde/logs/
data:
  root_path: /gpfs/home/unalg01/jepa
  dataset_train: 
  # - src/datasets/mnist3d/mnist_train_split.csv
  - src/datasets/mnist3d/mnist_valtrain_split.csv 
  dataset_val: 
  #- src/datasets/mnist3d/mnist_val_split.csv
  - src/datasets/mnist3d/mnist_valtest_split.csv 
  dataset_type: MRIDataset
  num_classes: 10
  frames_per_clip: 16
  num_segments: 2 # 4
  num_views_per_segment: 3
  frame_step: 1
  num_workers: 4
  random_clip_sampling: false
data_aug:
  auto_augment: true
  random_noise: 0.01
  random_bias: 0.1
  intensity_gamma: 0.1
  random_resize_aspect_ratio:
  - 0.9 
  - 1.1 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10  
optimization:
  attend_across_segments: true
  num_epochs: 400
  resolution: 32
  batch_size: 16
  weight_decay: 0.01
  final_weight_decay: 0.1 #0.1
  lr: 2.0e-4
  start_lr: 3.0e-5
  final_lr: 5.0e-6 #1.0e-6
  warmup: 3
  use_bfloat16: true
  train_log_iter_freq: 1
  val_log_iter_freq: 10
pretrain:
  model_name: vit_base
  checkpoint_key: encoder #target_encoder
  clip_duration: null
  frames_per_clip: 16
  tubelet_size: 4
  uniform_power: true
  use_silu: false
  tight_silu: false
  use_sdpa: true
  patch_size: 4
  frozen: false #default: true
  clip_grad_encoder: 1.0
  encoder_warmup: 3
  use_pos_embed: false #true
  in_channel_size: 1
  frame_step: 1 # added
  folder: /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2025_02_04__20_28_40/model_ckpt/latest-model/ 
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2024_12_05__21_17_18/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2024_12_04__15_18_47/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2024_12_02__15_40_14/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2024_12_02__12_27_26/model_ckpt/latest-model/
  #/your_absolute_file_path_to_directory_where_pretrained_models_are_contained/
  checkpoint: jepa-latest.pth.tar  # name of pretrained encoder model file inside folder
  write_tag: jepa

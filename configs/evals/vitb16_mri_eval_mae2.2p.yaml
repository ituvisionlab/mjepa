  attend_across_segments: true
  num_epochs: 400
  resolution: 256
  batch_size: 24
  weight_decay: 1.0e-3
  final_weight_decay: 1.0e-4 #0.1
  start_lr: 1.0e-4
  lr: 1.0e-4
  final_lr: 5.0e-5 #1.0e-6 
  lr_schedule_factor: 1.0 #2.0 #1.0 default
  warmup: 0 #2
  use_bfloat16: true
  clip_grad_classifier: 1.0
  seed: 1881 #234
  train_log_iter_freq: 1
  val_log_iter_freq: 1
  layer_decay: null #0.6 #null to turn it off
  classifier_depth: 1
  dropout: null #0.1 #null to turn off
  drop_rate: 0.0 #
  attn_drop_rate: 0.0

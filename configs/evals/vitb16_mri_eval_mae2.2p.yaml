  model_name: vit_base
  checkpoint_key: encoder #target_encoder
  frozen: false #true
  clip_duration: null
  frames_per_clip: 32
  tubelet_size: 8
  uniform_power: true
  use_silu: false
  tight_silu: false
  use_sdpa: true
  patch_size: 8
  clip_grad_encoder: 1.0
  encoder_warmup: 0
  use_pos_embed: false #true
  in_channel_size: 1
  frame_step: 1 # added

nodes: 3
tasks_per_node: 4
tag: mri-probe #k400-16x8x3
eval_name: video_classification_frozen
resume_checkpoint: false #true 
checkpoint_path: null #/gpfs/data/sodicksonlab/gozde/logs/mjepa_eval_distributed_2024_12_03__11_16_35/model_ckpt/latest-model/jepa-latest.pth.tar # null #classification model
logging:
  folder: /gpfs/data/sodicksonlab/gozde/logs/
data:
  root_path: /gpfs/home/unalg01/jepa
  dataset_train: 
  - src/datasets/adni_all_3class_bet_train.csv 
  dataset_val: 
  - src/datasets/adni_all_3class_bet_val.csv 
  dataset_type: MRIDataset
  num_classes: 3
  frames_per_clip: 128 #16
  num_segments: 1 #8 #for larger cropsize #rename to num_clips
  num_views_per_segment: 1
  frame_step: 1
  num_workers: 8
  random_clip_sampling: false
data_aug:
  auto_augment: true
  random_noise: 0.01
  random_bias: 0.1
  intensity_gamma: 0.1
  random_resize_aspect_ratio:
  - 0.9 
  - 1.1 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10  
optimization:
  attend_across_segments: true
  num_epochs: 400
  resolution: 128
  batch_size: 8 #16 uses 66GB, 8 uses 36GB 
  weight_decay: 1.0e-3
  final_weight_decay: 1.0e-4 #0.1
  lr: 2.0e-4
  start_lr: 3.0e-5
  final_lr: 5.0e-6 #1.0e-6
  warmup: 0 #3
  use_bfloat16: true
  clip_grad_classifier: 1.0
  seed: 234
  train_log_iter_freq: 1
  val_log_iter_freq: 1
pretrain:
  model_name: vit_large
  checkpoint_key: encoder #target_encoder
  clip_duration: null
  frames_per_clip: 128
  tubelet_size: 8
  uniform_power: true
  use_silu: false
  tight_silu: false
  use_sdpa: true
  patch_size: 8
  frozen: false #default: true
  clip_grad_encoder: 1.0
  encoder_warmup: 0
  use_pos_embed: false #true
  in_channel_size: 1
  frame_step: 1 
  folder: null
  checkpoint: null #jepa-latest.pth.tar  # name of pretrained encoder model file inside folder
  write_tag: jepa

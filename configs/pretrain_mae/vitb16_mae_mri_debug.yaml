app: mae
nodes: 1
tasks_per_node: 1  #1
tag: mae
data:
  dataset_type: MRIDataset
  datasets: # Relative path instead of abs path
  - src/datasets/debug_nii_list16.csv
  # - src/datasets/oasis3_all_bet.csv
  # - src/datasets/ppmi_all_bet_nii_with_bbox.csv 
  # - src/datasets/brats24_all_nii.csv
  # - src/datasets/ixi_all_bet_nii_with_bbox.csv
  # - src/datasets/mood_all_nii_with_bbox.csv
  # - src/datasets/adni_all_bet_train.csv
  decode_one_clip: true  # unused
  batch_size: 4
  num_clips: 1 #8
  num_frames: 128 #192 #16
  tubelet_size: 8
  sampling_rate: 1
  crop_size: 192 #128 #160 #224
  patch_size: 8
  in_channel_size: 1
  random_clip_sampling: false
  pin_mem: true
  num_workers: 0 #12
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: true
  random_noise: 0.01
  random_bias: 0.1
  intensity_gamma: 0.1
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.9 
  - 1.1 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10
  reprob: 0.0
logging:
  folder:  /gpfs/data/sodicksonlab/gozde/logs/ #/your_absolute_file_path_for_saving_logs_and_checkpoints/
  write_tag: jepa
loss:
  loss_exp: 2.0 #1.0
  reg_coeff: 0.0
mask:
  - aspect_ratio:
      - 1.0
      - 1.0
    num_blocks: 0.75
    spatial_scale:
      - 1
      - 1
    temporal_scale:
      - 1
      - 1
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: true #true 
  read_checkpoint: mae-latest.pth.tar #null # vitl16.pth.tar 
  ckpt_folder: /gpfs/data/sodicksonlab/gozde/logs/mae_pretrain_distributed_2025_03_06__15_13_47/model_ckpt/latest-model/
  # /gpfs/data/sodicksonlab/gozde/logs/mae_pretrain_distributed_2025_03_06__16_12_23/model_ckpt/latest-model/ 
  #/gpfs/data/sodicksonlab/gozde/logs/mae_pretrain_distributed_2025_03_06__15_13_15/model_ckpt/latest-model/
  seed: 1881 #234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_small_mod   #vit_base
  pred_model_name: vit_decoder_mod #vit_decoder
  pred_depth: 3 #12 #8
  pred_embed_dim: 384 #768
  uniform_power: true # positional_embedding related, check later
  use_mask_tokens: true
  zero_init_mask_tokens: true #false
optimization:
  ipe: null
  clip_grad: 1.0
  weight_decay: 0.005
  final_weight_decay: 0.001 #0.1 #for large dataset
  epochs: 500
  warmup: 5
  start_lr: 1.0e-3 #1.0e-4 #3.0e-5 #5e-05
  lr: 2.0e-3 #1.0e-3 #2.0e-4 #1.0e-4
  final_lr: 1.0e-4 #1.0e-5 #5.0e-6 #1.0e-6
  grad_accum_steps: 2 #4
app: vjepa
nodes: 1
tasks_per_node: 4
tag: mjepa
data:
  dataset_type: MRIDataset
  datasets: 
  - src/datasets/Prostate_pretraining_multichannel.csv
  decode_one_clip: true  # unused
  batch_size: 32 
  num_clips: 1
  num_frames: 32
  tubelet_size: 8
  sampling_rate: 1
  crop_size: 256
  patch_size: 8
  in_channel_size: 3
  random_clip_sampling: false
  pin_mem: true
  num_workers: 8
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: true
  random_noise: 0.01
  random_bias: 0.1
  intensity_gamma: 0.1
  random_resize_aspect_ratio:
  - 0.9 
  - 1.1 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 0
  reprob: 0.0
logging:
  folder:  /gpfs/data/sodicksonlab/gozde/logs/ #/your_absolute_file_path_for_saving_logs_and_checkpoints/
  write_tag: jepa
loss:
  loss_exp: 1.0 #2.0
  reg_coeff: 0.1
  alpha_vcr: 1.0
  beta_vcr: 0.1

mask:
  - aspect_ratio:
      - 1.0
      - 1.0
    num_blocks: 0.89
    spatial_scale:
      - 1
      - 1
    temporal_scale:
      - 1
      - 1
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: false
  read_checkpoint: null # vitl16.pth.tar # null #r_file
  ckpt_folder: /gpfs/data/sodicksonlab/gozde/pretrained_weights/ # currently hardcoded in train!
  seed: 1881 #234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_base
  pred_model_name: vit_predictor
  pred_depth: 6 #8
  pred_embed_dim: 384
  uniform_power: true # positional_embedding related, check later
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: null #300
  clip_grad: 1.0
  weight_decay: 0.005
  final_weight_decay: 0.001 #0.1 #for large dataset
  epochs: 500
  warmup: 10
  start_lr: 3.0e-5 #5e-05
  lr: 2.0e-4 #1.0e-4
  final_lr: 5.0e-6 #1.0e-6
  drop_rate: 0.0 #0.1 #default
  attn_drop_rate: 0.0 #0.1 #default
  ema:
  - 0.998
  - 1.0
  grad_accum_steps: 2 #4
  betas:
  - 0.9
  - 0.98

app: vjepa
nodes: 1
tasks_per_node: 4  #1
data:
  dataset_type: MRIDataset
  datasets: 
  - src/datasets/brats_file_paths.csv
  - src/datasets/updated_nii_file_paths.csv
  - src/datasets/mood_file_paths.csv
  - src/datasets/oasis_file_paths.csv
  - src/datasets/ixi_file_paths.csv
  decode_one_clip: true  # unused
  batch_size: 8
  num_clips: 8
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 1
  crop_size: 224
  patch_size: 16
  in_channel_size: 1
  random_clip_sampling: true
  pin_mem: false #true
  num_workers: 0 #12
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 1.0 
  - 1.0 
  random_resize_scale:
  - 0.9
  - 1.0
  rotation_degree: 10
  reprob: 0.0
logging:
  folder: logs/ #/your_absolute_file_path_for_saving_logs_and_checkpoints/
  write_tag: jepa
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  # - aspect_ratio:
  #     - 0.75
  #     - 1.5
  #   num_blocks: 2
  #   spatial_scale:
  #     - 0.7
  #     - 0.7
  #   temporal_scale:
  #     - 1.0
  #     - 1.0
  #   max_temporal_keep: 1.0
  #   max_keep: null
meta:
  load_checkpoint: false
  read_checkpoint: jepa-latest.pth.tar # vitl16.pth.tar # null #r_file
  ckpt_folder: null # logs/mjepa_pretrain_2024_11_30__05_06_48/model_ckpt/latest-model #/gpfs/data/sodicksonlab/gozde/logs/mjepa_pretrain_distributed_2024_12_08__16_12_11/model_ckpt/latest-model/
  seed: 234
  run_ID: kvokkfom #2e2giwpg #hivf7alg #null
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_small
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true # positional_embedding related, check later
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: 200
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.01
  final_weight_decay: 0.1
  epochs: 2000
  warmup: 0
  start_lr: 0.0001 #0.001
  lr: 0.0001 #0.001
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0
